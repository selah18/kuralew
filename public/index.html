<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#18201d;--muted:#737b76;--line:#e8e9e3;--green:#176b4d;--green2:#e1f2e9;--orange:#f1a64a;--shadow:0 8px 26px #16251b0b;--radius:19px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #86c8a9;outline-offset:2px}.app{max-width:650px;min-height:100dvh;margin:auto;padding-bottom:90px}.top{padding:18px 17px 13px;background:linear-gradient(135deg,#f8f7f2,#eaf3e9);position:sticky;top:0;z-index:5;border-bottom:1px solid #e6e9e1}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:10px;align-items:center}.logo{height:43px;width:43px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 5px 14px #176b4d2b}.brandname{font-weight:850;font-size:20px;letter-spacing:-.7px}.subbrand{font-size:11px;color:var(--muted);margin-top:2px}.location{border:1px solid #dfe7dc;background:#ffffffb8;border-radius:12px;padding:9px 10px;color:#315a45;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.searchwrap{margin-top:15px;display:flex;gap:8px}.search{flex:1;display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:14px;padding:0 12px;min-width:0}.search input{border:0;outline:0;background:transparent;width:100%;padding:13px 0}.filterbtn{border:1px solid var(--line);background:white;border-radius:14px;padding:0 14px;font-size:19px}.content{padding:17px}.hero{background:#173f31;color:white;border-radius:23px;padding:19px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:'ቁ';position:absolute;right:8px;bottom:-31px;font-size:115px;font-weight:900;color:#ffffff0c}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#b8e4c9;font-weight:800}.hero h1{font-size:25px;line-height:1.12;letter-spacing:-.8px;margin:9px 0 8px;max-width:330px}.hero p{font-size:12px;line-height:1.6;color:#d4e7dc;max-width:330px;margin:0 0 15px}.hero button{background:#f2b35c;color:#28291e;border:0;border-radius:12px;padding:11px 14px;font-weight:800}.hero-art{position:absolute;right:20px;bottom:18px;font-size:56px;filter:drop-shadow(0 8px 10px #0002)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.sectionhead h2{font-size:16px;letter-spacing:-.35px;margin:0}.smallbtn{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:800;padding:5px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{border:1px solid var(--line);border-radius:16px;background:white;padding:12px 3px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);min-width:0}.cat .emoji{height:39px;width:39px;border-radius:13px;display:grid;place-items:center;background:#f0f5ef;font-size:21px}.cat span:last-child{font-size:11px;font-weight:750}.cat.active{border-color:#176b4d;background:#e7f4eb;box-shadow:inset 0 0 0 1px #176b4d}.chips{display:flex;gap:7px;overflow:auto;padding:1px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:white;color:#65706a;white-space:nowrap;font-size:12px}.chip.active{background:var(--green);color:white;border-color:var(--green)}.listinggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.listing{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;min-width:0;box-shadow:0 3px 10px #15231a05;position:relative}.photo{height:143px;background:#e8eee7;display:grid;place-items:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .placeholder{font-size:53px;filter:drop-shadow(0 5px 5px #0001)}.photo .condition{position:absolute;left:9px;top:9px;background:#ffffffed;border-radius:7px;padding:5px 7px;font-size:9px;font-weight:800;color:#3e5949}.heart{position:absolute;right:8px;top:8px;width:31px;height:31px;border:0;border-radius:50%;background:#ffffffed;font-size:17px;color:#43554a;display:grid;place-items:center}.heart.saved{color:#d65057}.listingbody{padding:11px}.price{font-size:16px;font-weight:900;letter-spacing:-.4px;margin-bottom:5px}.titleline{font-size:12px;line-height:1.4;font-weight:700;min-height:33px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:10px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{color:#176b4d;font-size:10px;font-weight:800}.badge{display:inline-flex;align-items:center;gap:3px;background:#e3f5e9;color:#176b4d;border-radius:5px;padding:4px 5px;font-size:9px;font-weight:800;margin-top:8px}.empty{background:white;border:1px dashed #d8ddd5;border-radius:18px;padding:30px 15px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.bottomnav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(650px,100%);background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 7px calc(8px + env(safe-area-inset-bottom));}.navitem{border:0;background:transparent;color:#828a83;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:4px 0}.navitem .ni{font-size:20px;line-height:1.1}.navitem.active{color:var(--green);font-weight:850}.navitem.sell .ni{background:var(--green);color:white;width:36px;height:30px;border-radius:11px;display:grid;place-items:center;font-size:22px;margin-top:-7px;box-shadow:0 4px 10px #176b4d2c}.pagehead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 17px}.pagehead h2{margin:0;font-size:23px;letter-spacing:-.7px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-weight:800;font-size:12px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4dc;background:#fbfcfa;border-radius:12px;padding:12px;color:var(--ink);min-width:0}.field textarea{min-height:85px;resize:vertical}.primary{background:var(--green);color:white;border:0;border-radius:13px;padding:13px 16px;font-weight:850;width:100%}.secondary{background:#edf5ef;color:var(--green);border:1px solid #d9e9dc;border-radius:12px;padding:10px 13px;font-weight:800}.hint{font-size:11px;color:var(--muted);line-height:1.5}.profilehero{display:flex;align-items:center;gap:12px}.avatar{width:52px;height:52px;border-radius:18px;background:#e4f1e7;color:var(--green);font-weight:900;font-size:21px;display:grid;place-items:center}.profilehero h3{margin:0 0 4px}.profilehero p{margin:0;color:var(--muted);font-size:12px}.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:white;padding:14px 0;text-align:left;color:var(--ink);border-bottom:1px solid var(--line)}.rowbtn:last-child{border-bottom:0}.rowbtn span:last-child{color:#929a93}.modalback{position:fixed;inset:0;z-index:30;background:#15231a70;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{width:min(650px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:15px 17px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h2{font-size:18px;margin:0}.close{border:0;background:#e8ebe5;border-radius:50%;width:34px;height:34px;font-size:20px}.detailphoto{height:245px;border-radius:17px;background:#e8eee7;display:grid;place-items:center;overflow:hidden;position:relative}.detailphoto img{width:100%;height:100%;object-fit:cover}.detailphoto .placeholder{font-size:80px}.detailprice{font-size:25px;font-weight:900;margin:15px 0 5px}.detailtitle{font-size:18px;font-weight:800;line-height:1.35}.detailmeta{font-size:12px;color:var(--muted);margin:9px 0 14px}.detaildesc{line-height:1.6;font-size:13px;white-space:pre-wrap}.detailactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:60;background:#1d3528;color:white;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);font-size:12px;max-width:90%;text-align:center}.hidden{display:none!important}.tagline{color:var(--muted);font-size:11px;margin-top:3px}.safety{display:flex;gap:10px;background:#fff5e7;border:1px solid #f3dfbc;border-radius:15px;padding:13px;font-size:12px;line-height:1.5;color:#70522a;margin-bottom:13px}.safety b{display:block;color:#5c421e;margin-bottom:3px}@keyframes up{from{transform:translateY(15px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(min-width:540px){.photo{height:180px}.content{padding:20px}.top{padding-left:20px;padding-right:20px}.listinggrid{gap:14px}}
</style>

<body><div class="app">
<header class="top"><div class="toprow"><div class="brand"><div class="logo">ቁ</div><div><div class="brandname">Kuralew <span style="color:var(--green)">ቁራሌው</span></div><div class="subbrand">Find it. Sell it. Kuralew it.</div></div></div><button class="location" id="locationBtn">📍 Addis Ababa ▾</button></div><div class="searchwrap"><div class="search"><span>⌕</span><input id="searchInput" placeholder="What are you looking for?" autocomplete="off"><button id="clearSearch" class="smallbtn hidden">✕</button></div><button class="filterbtn" id="filterBtn" aria-label="Filters">☷</button></div></header>
<main class="content" id="main"></main>
<nav class="bottomnav" aria-label="Main navigation"><button class="navitem active" data-page="home"><span class="ni">⌂</span>Explore</button><button class="navitem" data-page="saved"><span class="ni">♡</span>Saved</button><button class="navitem sell" data-page="sell"><span class="ni">＋</span>Sell</button><button class="navitem" data-page="chats"><span class="ni">▤</span>Chats</button><button class="navitem" data-page="profile"><span class="ni">◉</span>Profile</button></nav>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#f6f5f1');tg?.setBackgroundColor?.('#f6f5f1')}catch(e){}
const API_BASE=window.KURALEW_API_BASE||'';const AMHARIC_NAME='ቁራሌው';
const categories=[['All','✦'],['Phones','📱'],['Fashion','👟'],['Home','🛋️'],['Vehicles','🚗'],['Property','🏠'],['Electronics','💻'],['Books','📚'],['Services','🧰'],['Other','📦']];
const demo=[
{id:'d1',title:'iPhone 13 · 128GB',price:24500,category:'Phones',condition:'Good',city:'Bole, Addis Ababa',seller:'Miki Electronics',verified:true,emoji:'📱',description:'Well-kept iPhone 13 with 128GB storage. Face ID and cameras working. Come inspect before buying.',time:'12 min ago',posted:Date.now()-720000,phone:'',featured:true},
{id:'d2',title:'Modern 3-seat sofa',price:18500,category:'Home',condition:'Used',city:'CMC, Addis Ababa',seller:'Hana Home',verified:true,emoji:'🛋️',description:'Comfortable 3-seat sofa. Clean and in good condition. Buyer can arrange transport.',time:'35 min ago',posted:Date.now()-2100000},
{id:'d3',title:'Men’s sneakers · size 42',price:1800,category:'Fashion',condition:'Like new',city:'Piassa, Addis Ababa',seller:'Abel T.',verified:false,emoji:'👟',description:'Worn a few times only. Available for pickup around Piassa.',time:'1 hr ago',posted:Date.now()-3600000},
{id:'d4',title:'HP EliteBook 840 G7',price:27500,category:'Electronics',condition:'Good',city:'Kazanchis, Addis Ababa',seller:'Dawit Tech',verified:true,emoji:'💻',description:'Core i5 business laptop, SSD, webcam and keyboard tested. Please inspect in person.',time:'2 hrs ago',posted:Date.now()-7200000},
{id:'d5',title:'Toyota Corolla 2008',price:980000,category:'Vehicles',condition:'Used',city:'Megenagna, Addis Ababa',seller:'Tesfaye',verified:true,emoji:'🚗',description:'Clean papers, available for inspection by appointment. Price negotiable after viewing.',time:'3 hrs ago',posted:Date.now()-10800000},
{id:'d6',title:'First-year university textbooks',price:950,category:'Books',condition:'Good',city:'Arat Kilo, Addis Ababa',seller:'Sami Student',verified:false,emoji:'📚',description:'Several introductory textbooks available. Message to confirm titles and condition.',time:'4 hrs ago',posted:Date.now()-14400000},
{id:'d7',title:'Studio apartment for rent',price:12500,category:'Property',condition:'Available',city:'Ayat, Addis Ababa',seller:'Liya Homes',verified:true,emoji:'🏠',description:'Studio apartment listing. Confirm availability, exact location, terms and ownership/agency details before paying anything.',time:'5 hrs ago',posted:Date.now()-18000000},
{id:'d8',title:'Professional photo session',price:2500,category:'Services',condition:'Booking',city:'Addis Ababa',seller:'Nati Visuals',verified:true,emoji:'📸',description:'Portrait and event photography. Ask for a portfolio, sample work and booking availability.',time:'Yesterday',posted:Date.now()-86400000},
{id:'d9',title:'Air fryer · 5 litre',price:4200,category:'Home',condition:'Good',city:'Sar Bet, Addis Ababa',seller:'Martha',verified:false,emoji:'🍟',description:'Works well and has been cleaned. Test it during pickup.',time:'Yesterday',posted:Date.now()-90000000},
{id:'d10',title:'Wireless headphones',price:1300,category:'Electronics',condition:'Like new',city:'Mexico, Addis Ababa',seller:'Yonas Gadgets',verified:true,emoji:'🎧',description:'Wireless headphones with charging cable. You are welcome to test them.',time:'Yesterday',posted:Date.now()-93000000}
];
const state={page:'home',category:'All',query:'',sort:'newest',condition:'All',city:'Addis Ababa',listings:[],saved:new Set(),chats:[],userListings:[],selected:null,filtersOpen:false,telegramUser:tg?.initDataUnsafe?.user||null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'ETB '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
function allListings(){return [...state.userListings,...state.listings.filter(x=>!state.userListings.some(u=>u.id===x.id))]}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function iconCat(cat){return categories.find(c=>c[0]===cat)?.[1]||'📦'}
function filtered(){let arr=allListings().filter(x=>{const q=state.query.toLowerCase();return(!q||[x.title,x.category,x.city,x.seller,x.description].join(' ').toLowerCase().includes(q))&&(state.category==='All'||x.category===state.category)&&(state.condition==='All'||x.condition===state.condition)&&(state.city==='All Ethiopia'||String(x.city).toLowerCase().includes(state.city.toLowerCase()))});if(state.sort==='price-low')arr.sort((a,b)=>a.price-b.price);else if(state.sort==='price-high')arr.sort((a,b)=>b.price-a.price);else arr.sort((a,b)=>(b.posted||0)-(a.posted||0));return arr}
function card(x){const saved=state.saved.has(x.id);return `<article class="listing" data-open="${esc(x.id)}"><div class="photo">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy" onerror="this.remove()">`:''}<span class="placeholder">${esc(x.emoji||iconCat(x.category))}</span><span class="condition">${esc(x.condition||'Used')}</span><button class="heart ${saved?'saved':''}" data-save="${esc(x.id)}" aria-label="${saved?'Remove saved item':'Save item'}">${saved?'♥':'♡'}</button></div><div class="listingbody"><div class="price">${money(x.price)}</div><div class="titleline">${esc(x.title)}</div><div class="meta">⌖ ${esc(x.city||'Ethiopia')}</div>${x.verified?'<div class="badge">✓ Verified seller</div>':''}</div></article>`}
function grid(arr){return arr.length?`<div class="listinggrid">${arr.map(card).join('')}</div>`:`<div class="empty"><strong>Nothing here yet</strong>Try another search or category, or be the first to post an item.</div>`}
function renderHome(){const arr=filtered();return `<section class="hero"><div class="eyebrow">YOUR NEIGHBOURHOOD MARKET</div><h1>Good finds.<br>Closer to home.</h1><p>Buy and sell with people around Ethiopia. Discover deals, compare, and meet safely.</p><button data-action="sell">＋ Post a free ad</button><div class="hero-art">🛍️</div></section><div class="sectionhead"><h2>Explore categories</h2><button class="smallbtn" data-action="allcats">View all</button></div><div class="categories">${categories.slice(0,8).map(c=>`<button class="cat ${state.category===c[0]?'active':''}" data-category="${c[0]}"><span class="emoji">${c[1]}</span><span>${c[0]}</span></button>`).join('')}</div><div class="sectionhead"><h2>${state.query?'Search results':state.category==='All'?'Fresh finds':state.category+' for you'}</h2><button class="smallbtn" data-action="sort">⇅ Sort</button></div><div class="chips">${[['All','All'],['Phones','Phones'],['Home','Home'],['Fashion','Fashion'],['Electronics','Electronics'],['Vehicles','Vehicles']].map(c=>`<button class="chip ${state.category===c[0]?'active':''}" data-category="${c[0]}">${c[1]}</button>`).join('')}</div><div style="height:12px"></div>${grid(arr)}<div style="height:18px"></div><div class="safety"><span style="font-size:22px">🛡️</span><div><b>Buy smart. Meet safely.</b>Inspect items before paying, meet in a busy public place, and never share OTPs or send deposits to strangers.</div></div>`}
function renderSaved(){const arr=allListings().filter(x=>state.saved.has(x.id));return `<div class="pagehead"><div><h2>Saved items</h2><div class="tagline">Your shortlist, all in one place.</div></div><span style="font-size:27px">♡</span></div>${grid(arr)}`}
function renderSell(){return `<div class="pagehead"><div><h2>Post an ad</h2><div class="tagline">Reach buyers near you.</div></div><span style="font-size:27px">＋</span></div><div class="safety"><span>✨</span><div><b>Posting is free in this demo</b>Be honest about condition, price and location. Never post private documents or sensitive personal information.</div></div><form id="sellForm" class="card"><div class="field"><label for="adTitle">What are you selling? *</label><input id="adTitle" name="title" placeholder="e.g. Samsung Galaxy A54" maxlength="90" required></div><div class="field"><label for="adCategory">Category *</label><select id="adCategory" name="category" required>${categories.filter(c=>c[0]!=='All').map(c=>`<option value="${c[0]}">${c[1]} ${c[0]}</option>`).join('')}</select></div><div class="field"><label for="adPrice">Price in ETB *</label><input id="adPrice" name="price" type="number" min="1" step="1" placeholder="e.g. 8500" required></div><div class="field"><label for="adCondition">Condition *</label><select id="adCondition" name="condition"><option>Used</option><option>Like new</option><option>Good</option><option>New</option><option>Available</option><option>Booking</option></select></div><div class="field"><label for="adCity">Location *</label><select id="adCity" name="city"><option>Bole, Addis Ababa</option><option>Piassa, Addis Ababa</option><option>CMC, Addis Ababa</option><option>Megenagna, Addis Ababa</option><option>Arat Kilo, Addis Ababa</option><option>Other, Addis Ababa</option><option>Adama</option><option>Bahir Dar</option><option>Hawassa</option><option>Dire Dawa</option><option>Mekelle</option><option>Jimma</option><option>Other Ethiopia</option></select></div><div class="field"><label for="adDescription">Description *</label><textarea id="adDescription" name="description" placeholder="Describe condition, size, what's included and pickup details..." maxlength="1200" required></textarea></div><div class="field"><label for="adImage">Image URL (optional)</label><input id="adImage" name="image" type="url" placeholder="https://…"><div class="hint">Demo version accepts an image URL. File uploads can be connected to storage when deploying.</div></div><div class="field"><label for="adSeller">Display name *</label><input id="adSeller" name="seller" maxlength="50" placeholder="Your first name or shop name" required></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:15px"><input type="checkbox" required style="margin-top:2px"> I agree to post accurate information and follow the marketplace safety rules.</label><button class="primary" type="submit">Publish listing →</button><p class="hint" style="margin-bottom:0">Listings in this preview are stored on this device only. Live public listings need the included Cloudflare Worker + D1 backend.</p></form>`}
function renderChats(){return `<div class="pagehead"><div><h2>Messages</h2><div class="tagline">Talk to sellers before you buy.</div></div><span style="font-size:27px">▤</span></div>${state.chats.length?state.chats.map((c,i)=>`<button class="rowbtn" data-chat="${i}"><span style="display:flex;gap:12px;align-items:center"><span class="avatar">${esc((c.seller||'?').slice(0,1).toUpperCase())}</span><span><b>${esc(c.seller)}</b><div class="tagline">${esc(c.title)} · ${esc(c.last||'Conversation started')}</div></span></span><span>›</span></button>`).join(''):`<div class="empty"><div style="font-size:35px;margin-bottom:8px">💬</div><strong>No conversations yet</strong>Open a listing and tap “Message seller” to start a conversation.</div>`}<div class="safety" style="margin-top:15px"><span>🔒</span><div><b>Keep conversations safe</b>Never share verification codes or send advance payments to unknown sellers. Kuralew does not provide escrow in this version.</div></div>`}
function renderProfile(){const name=state.telegramUser?[state.telegramUser.first_name,state.telegramUser.last_name].filter(Boolean).join(' '):'Kuralew Member';return `<div class="pagehead"><div><h2>My profile</h2><div class="tagline">Your marketplace space.</div></div><span style="font-size:27px">◉</span></div><div class="card"><div class="profilehero"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><div><h3>${esc(name)}</h3><p>${tg?'Connected through Telegram':'Demo profile · Telegram preview'}</p><div class="badge">✦ Community member</div></div></div><p class="hint" style="margin-bottom:0;margin-top:13px">This preview does not verify your identity or phone number. Verification badges must only be granted after a real verification process is implemented.</p></div><div class="card" style="padding:0 15px"><button class="rowbtn" data-action="myads"><span>📦 &nbsp; My listings (${state.userListings.length})</span><span>›</span></button><button class="rowbtn" data-action="saved"><span>♡ &nbsp; Saved items (${state.saved.size})</span><span>›</span></button><button class="rowbtn" data-action="safety"><span>🛡️ &nbsp; Safety centre</span><span>›</span></button><button class="rowbtn" data-action="about"><span>ℹ️ &nbsp; About Kuralew</span><span>›</span></button></div><div class="card"><b>Made for Ethiopia 🇪🇹</b><p class="hint">Kuralew ቁራሌው connects local buyers and sellers. Meet in public, inspect before paying, and report suspicious listings.</p><button class="secondary" data-action="share">↗ Share Kuralew</button></div>`}
function render(){const main=$('#main');const pages={home:renderHome,saved:renderSaved,sell:renderSell,chats:renderChats,profile:renderProfile};main.innerHTML=(pages[state.page]||renderHome)();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#searchInput').value=state.query;$('#clearSearch').classList.toggle('hidden',!state.query);}
function modal(html){$('#modalRoot').innerHTML=`<div class="modalback" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;$('#modalRoot').querySelector('.modalback').addEventListener('click',e=>{if(e.target.dataset.dismiss)closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}
function showDetail(id){const x=allListings().find(a=>a.id===id);if(!x)return;state.selected=id;modal(`<div class="modalhead"><span class="eyebrow" style="color:var(--green)">${esc(x.category)} · ${esc(x.condition)}</span><button class="close" data-close>×</button></div><div class="detailphoto">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" onerror="this.remove()">`:''}<span class="placeholder">${esc(x.emoji||iconCat(x.category))}</span></div><div class="detailprice">${money(x.price)}</div><div class="detailtitle">${esc(x.title)}</div><div class="detailmeta">⌖ ${esc(x.city)} &nbsp; · &nbsp; ${esc(x.time||'Recently posted')}<br><br>${x.verified?'<span class="verified">✓ Verified seller</span>':'<span>Seller not verified</span>'} &nbsp; · &nbsp; ${esc(x.seller)}</div><div class="detaildesc">${esc(x.description||'No description provided.')}</div><div class="safety" style="margin-top:15px"><span>🛡️</span><div><b>Meet safely</b>Inspect the item before payment. Meet in a busy public place and avoid deposits or links sent by strangers.</div></div><div class="detailactions"><button class="secondary" data-detail-save="${esc(id)}">${state.saved.has(id)?'♥ Saved':'♡ Save item'}</button><button class="primary" style="width:auto" data-message="${esc(id)}">Message seller</button></div><button class="rowbtn" data-report="${esc(id)}" style="margin-top:10px"><span>⚑ Report this listing</span><span>›</span></button>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;}
function startChat(id){const x=allListings().find(a=>a.id===id);if(!x)return;if(x.seller===((state.telegramUser?.first_name)||'')){toast('This is your own listing');return}let c=state.chats.find(c=>c.listingId===id);if(!c){c={listingId:id,seller:x.seller,title:x.title,last:'Conversation started',messages:[]};state.chats.unshift(c)}closeModal();render();modal(`<div class="modalhead"><div><h2>${esc(c.seller)}</h2><div class="tagline">${esc(c.title)}</div></div><button class="close" data-close>×</button></div><div class="safety"><span>🛡️</span><div><b>Stay on your guard</b>Do not share OTPs or send deposits. This demo chat is stored only on this device and does not send messages to the seller.</div></div><div id="messages" style="min-height:120px;max-height:38dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0">${(c.messages||[]).map(m=>`<div style="align-self:${m.me?'flex-end':'flex-start'};max-width:85%;background:${m.me?'#dff1e5':'white'};border:1px solid var(--line);border-radius:13px;padding:10px 12px;line-height:1.45">${esc(m.text)}</div>`).join('')||'<div class="empty">Start with a question about the item.</div>'}</div><form id="chatForm" style="display:flex;gap:8px;margin-top:10px"><input name="message" placeholder="Write a message…" required maxlength="500" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px"><button class="primary" style="width:auto;padding:0 16px">Send</button></form>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;$('#chatForm').onsubmit=e=>{e.preventDefault();const text=e.target.message.value.trim();if(!text)return;c.messages=c.messages||[];c.messages.push({text,me:true});c.last=text;startChatRender(c)};}
function startChatRender(c){const msgs=$('#messages');if(msgs)msgs.innerHTML=c.messages.map(m=>`<div style="align-self:${m.me?'flex-end':'flex-start'};max-width:85%;background:${m.me?'#dff1e5':'white'};border:1px solid var(--line);border-radius:13px;padding:10px 12px;line-height:1.45">${esc(m.text)}</div>`).join('');const form=$('#chatForm');if(form){form.reset();} }
function showFilters(){modal(`<div class="modalhead"><h2>Search filters</h2><button class="close" data-close>×</button></div><div class="field"><label>Location</label><select id="filterCity">${['Addis Ababa','Adama','Bahir Dar','Hawassa','Dire Dawa','Mekelle','Jimma','All Ethiopia'].map(c=>`<option ${state.city===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Condition</label><select id="filterCondition">${['All','New','Like new','Good','Used','Available','Booking'].map(c=>`<option ${state.condition===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Sort by</label><select id="filterSort"><option value="newest" ${state.sort==='newest'?'selected':''}>Newest first</option><option value="price-low" ${state.sort==='price-low'?'selected':''}>Price: low to high</option><option value="price-high" ${state.sort==='price-high'?'selected':''}>Price: high to low</option></select></div><button class="primary" id="applyFilters">Apply filters</button><button class="rowbtn" id="resetFilters"><span>Reset filters</span><span>↺</span></button>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;$('#applyFilters').onclick=()=>{state.city=$('#filterCity').value;state.condition=$('#filterCondition').value;state.sort=$('#filterSort').value;closeModal();state.page='home';render()};$('#resetFilters').onclick=()=>{state.city='All Ethiopia';state.condition='All';state.sort='newest';closeModal();render()}}
async function api(path,opts={}){if(!API_BASE)return null;try{const r=await fetch(API_BASE+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});if(!r.ok)throw new Error('API '+r.status);return await r.json()}catch(e){console.warn(e);return null}}
async function loadRemote(){
  if(!API_BASE)return;
  const data=await api('/api/listings');
  if(data&&Array.isArray(data.listings)&&data.listings.length>0){
    state.listings=data.listings;
    render();
  }
}
function toggleSave(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);render();if(state.selected)showDetail(state.selected);else toast(state.saved.has(id)?'Saved to your list':'Removed from saved')}
function navigate(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value;state.page='home';render();$('#searchInput').focus();const inp=$('#searchInput');inp.setSelectionRange(inp.value.length,inp.value.length)});$('#clearSearch').onclick=()=>{state.query='';render()};$('#filterBtn').onclick=showFilters;$('#locationBtn').onclick=()=>{state.city=state.city==='Addis Ababa'?'All Ethiopia':'Addis Ababa';$('#locationBtn').textContent='📍 '+(state.city==='All Ethiopia'?'All Ethiopia':'Addis Ababa')+' ▾';render()};document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
document.addEventListener('click',e=>{const save=e.target.closest('[data-save]');if(save){e.stopPropagation();toggleSave(save.dataset.save);return}const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;state.page='home';render();return}const open=e.target.closest('[data-open]');if(open){showDetail(open.dataset.open);return}const act=e.target.closest('[data-action]');if(act){const a=act.dataset.action;if(a==='sell')navigate('sell');else if(a==='allcats'){modal(`<div class="modalhead"><h2>All categories</h2><button class="close" data-close>×</button></div><div class="categories">${categories.map(c=>`<button class="cat" data-modal-category="${c[0]}"><span class="emoji">${c[1]}</span><span>${c[0]}</span></button>`).join('')}</div>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;$('#modalRoot').querySelectorAll('[data-modal-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.modalCategory;closeModal();navigate('home')})}else if(a==='sort'){state.sort=state.sort==='newest'?'price-low':state.sort==='price-low'?'price-high':'newest';toast('Sort: '+({'newest':'Newest first','price-low':'Price low to high','price-high':'Price high to low'}[state.sort]));render()}else if(a==='saved')navigate('saved');else if(a==='myads'){const old=state.category;state.category='All';state.query='';state.page='saved';const arr=state.userListings;$('#main').innerHTML=`<div class="pagehead"><div><h2>My listings</h2><div class="tagline">Items you have posted on this device.</div></div></div>${grid(arr)}`;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page==='profile'))}else if(a==='safety')showInfo('Safety centre','Meet in busy public places, inspect goods before paying, compare prices, and keep communication on-platform when possible. Never share OTPs, passwords or banking codes. Avoid advance deposits to unknown people. Report suspicious listings. Kuralew does not currently verify identity or hold payments.');else if(a==='about')showInfo('About Kuralew ቁራሌው','Kuralew is a community marketplace concept for discovering local goods and services in Ethiopia. This version includes an interactive local demo. Listings, chats and saved items are stored on your device until the live backend is configured.');else if(a==='share'){const url=location.href;if(navigator.share)navigator.share({title:'Kuralew ቁራሌው',text:'Find it. Sell it. Kuralew it.',url}).catch(()=>{});else if(tg?.openTelegramLink)toast('Add your live Telegram bot link before sharing');else{navigator.clipboard?.writeText(url);toast('Page link copied')}}return}const msg=e.target.closest('[data-message]');if(msg){startChat(msg.dataset.message);return}const ds=e.target.closest('[data-detail-save]');if(ds){toggleSave(ds.dataset.detailSave);return}const report=e.target.closest('[data-report]');if(report){const id=report.dataset.report;closeModal();modal(`<div class="modalhead"><h2>Report listing</h2><button class="close" data-close>×</button></div><p class="hint">Help keep the community safe. Choose the reason that best fits.</p><div class="field"><select id="reportReason"><option>Suspicious or fake listing</option><option>Wrong price or misleading details</option><option>Prohibited item</option><option>Spam or duplicate</option><option>Unsafe or abusive behaviour</option><option>Other</option></select></div><div class="field"><textarea id="reportNote" placeholder="Optional details (don't include sensitive information)"></textarea></div><button class="primary" id="submitReport">Submit report</button>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;$('#submitReport').onclick=()=>{const reports=JSON.parse(localStorage.getItem('kuralew_reports')||'[]');reports.push({id,reason:$('#reportReason').value,note:$('#reportNote').value,at:Date.now()});localStorage.setItem('kuralew_reports',JSON.stringify(reports));closeModal();toast('Report saved on this device. Live moderation is not connected yet.')}}});
function showInfo(title,body){modal(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-close>×</button></div><div class="card" style="line-height:1.7">${esc(body)}</div><button class="primary" data-close-info>Got it</button>`);$('#modalRoot').querySelector('[data-close]').onclick=closeModal;$('#modalRoot').querySelector('[data-close-info]').onclick=closeModal}
document.addEventListener('submit',async e=>{if(e.target.id!=='sellForm')return;e.preventDefault();const f=new FormData(e.target);const item={id:'u'+Date.now(),title:String(f.get('title')).trim(),category:f.get('category'),price:Number(f.get('price')),condition:f.get('condition'),city:f.get('city'),description:String(f.get('description')).trim(),image:String(f.get('image')||'').trim(),seller:String(f.get('seller')).trim(),verified:false,emoji:iconCat(f.get('category')),posted:Date.now(),time:'Just now'};if(!item.title||!item.price||item.price<1){toast('Please enter a title and valid price');return}const remote=await api('/api/listings',{method:'POST',body:JSON.stringify({...item,telegramUserId:state.telegramUser?.id||null})});state.userListings.unshift(item);if(remote?.listing?.id)item.id=String(remote.listing.id);toast(remote?'Your listing was published!':'Demo listing published on this device');navigate('home');});
// Demo seed plus best-effort remote sync. The frontend stays usable if API is not configured.
state.listings=demo;state.city='Addis Ababa';render();loadRemote();
})();
</script></body></html>
